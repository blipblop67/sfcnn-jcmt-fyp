# As gbs.yaml but every cutout spans the same physical size (0.2 pc) instead of 96 arcsec.
data:
  manifest: configs/gbs_manifest.yaml
  output: data/processed/gbs_phys.npz
cutout:
  size_pc: 0.2
split:
  mode: region
  test_regions: [Perseus]
  val_regions: [Cepheus]
  seed: 42
train:
  epochs: 60
  min_epochs: 15
  patience: 12
  run_dir: runs/gbs_phys
